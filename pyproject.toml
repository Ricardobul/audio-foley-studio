[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-foley-studio"
version = "1.0.0"
description = "Unified Procedural Sound Design & AI Foley Studio for Motion Design, Video Production and Cinema"
readme = "README.md"
authors = [{ name = "Ricardobul" }]
license = "MIT"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.scripts]
audio-foley = "audio_foley_studio.cli:main"

[tool.setuptools.packages.find]
include = ["audio_foley_studio*"]
